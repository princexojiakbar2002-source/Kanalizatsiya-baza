<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oqava Suv Inshootlari — Bazasi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<style>
  :root{
    --bg:#EEF2F1;
    --surface:#FFFFFF;
    --ink:#16262A;
    --muted:#62777A;
    --border:#DCE6E5;
    --teal:#0F6B7A;
    --teal-deep:#0A4A54;
    --amber:#D97706;
    --green:#1F9254;
    --red:#D6493F;
    --radius:10px;
    --shadow:0 2px 10px rgba(10,40,45,.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:88px;
  }
  .mono{font-family:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;}
  .eyebrow{
    text-transform:uppercase;
    letter-spacing:.08em;
    font-size:11px;
    font-weight:700;
    color:var(--muted);
  }
  a{color:var(--teal);}
  button{font-family:inherit;}
  input, select, textarea{
    font-family:inherit;
    font-size:16px;
  }
  code{background:#0000000d; padding:1px 5px; border-radius:4px; font-family:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;}
  :focus-visible{outline:2px solid var(--teal); outline-offset:2px;}

  /* ---------- Header ---------- */
  header{
    background:var(--teal-deep);
    color:#fff;
    padding:16px 16px 14px;
    position:sticky; top:0; z-index:20;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  header .title-row{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  header h1{
    margin:0;
    font-size:19px;
    font-weight:800;
    letter-spacing:.01em;
  }
  header .sub{
    margin-top:2px;
    font-size:11px;
    letter-spacing:.06em;
    color:#AFD7DC;
    text-transform:uppercase;
  }
  #connBadge{font-weight:700;}
  .icon-btn{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.2);
    color:#fff;
    width:36px; height:36px;
    border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:16px;
    cursor:pointer;
  }
  .header-actions{display:flex; gap:8px;}

  .stats-row{
    display:flex; gap:8px; overflow-x:auto;
    margin-top:12px;
    padding-bottom:2px;
  }
  .stat-chip{
    flex:none;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.16);
    border-radius:8px;
    padding:6px 10px;
    font-size:12px;
    font-family:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;
    white-space:nowrap;
  }
  .stat-chip b{font-size:13px;}

  /* ---------- Filters ---------- */
  .filters{
    position:sticky; top:84px; z-index:19;
    background:var(--bg);
    padding:12px 16px 8px;
    border-bottom:1px solid var(--border);
  }
  .chips{
    display:flex; gap:8px; overflow-x:auto;
    padding-bottom:8px;
    -webkit-overflow-scrolling:touch;
  }
  .chip{
    flex:none;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--ink);
    padding:7px 12px;
    border-radius:20px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{
    background:var(--teal);
    border-color:var(--teal);
    color:#fff;
  }
  .search-row{display:flex; gap:8px;}
  .search-row input[type=search]{
    flex:1;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--surface);
  }
  .search-row select{
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--surface);
    padding:10px 8px;
    max-width:132px;
  }
  .view-toggle{display:flex; gap:8px; margin-top:10px;}
  .view-toggle-btn{
    flex:1;
    background:var(--surface); border:1px solid var(--border); color:var(--ink);
    padding:9px; border-radius:8px; font-size:13px; font-weight:700; cursor:pointer;
  }
  .view-toggle-btn.active{background:var(--teal); border-color:var(--teal); color:#fff;}
  #assetList.hidden{display:none;}
  #overviewMap{height:60vh; min-height:320px; border-radius:10px; border:1px solid var(--border);}
  #overviewMap.hidden{display:none;}

  /* ---------- List ---------- */
  main{padding:12px 16px 24px;}
  .empty-state{
    text-align:center;
    color:var(--muted);
    padding:56px 20px;
    font-size:14px;
  }
  .empty-state .big{font-size:34px; display:block; margin-bottom:8px;}
  .asset-card{
    display:flex;
    gap:12px;
    background:var(--surface);
    border:1px solid var(--border);
    border-left:5px solid var(--muted);
    border-radius:var(--radius);
    padding:10px;
    margin-bottom:10px;
    box-shadow:var(--shadow);
    cursor:pointer;
    align-items:center;
  }
  .card-thumb{
    width:56px; height:56px;
    border-radius:8px;
    object-fit:cover;
    flex:none;
    background:var(--bg);
  }
  .card-thumb-placeholder{
    display:flex; align-items:center; justify-content:center;
    font-size:24px;
  }
  .card-info{flex:1; min-width:0;}
  .card-title{font-weight:700; font-size:15px; margin-bottom:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .card-sub{font-size:12px; color:var(--muted); letter-spacing:.02em;}
  .card-loc{font-size:12px; color:var(--muted); margin-top:2px; font-family:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .card-side{display:flex; flex-direction:column; align-items:flex-end; gap:6px; flex:none;}
  .card-status{
    flex:none;
    font-size:11px;
    font-weight:700;
    padding:4px 8px;
    border-radius:6px;
    text-transform:uppercase;
    letter-spacing:.03em;
    border:none;
    cursor:pointer;
  }
  .card-edit-btn{
    background:var(--bg); border:1px solid var(--border); color:var(--muted);
    width:28px; height:28px; border-radius:6px; font-size:13px; cursor:pointer;
  }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; right:18px; bottom:22px; z-index:25;
    width:58px; height:58px;
    border-radius:50%;
    background:var(--teal);
    color:#fff;
    border:none;
    font-size:28px;
    box-shadow:0 4px 14px rgba(10,60,70,.35);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .fab:active{background:var(--teal-deep);}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px);
    background:var(--ink); color:#fff;
    padding:10px 18px; border-radius:24px;
    font-size:13px;
    opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s;
    z-index:60;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
  #toast.show{opacity:1; transform:translate(-50%,0);}

  /* ---------- Modals ---------- */
  .modal{
    position:fixed; inset:0; z-index:50;
    background:rgba(10,25,28,.55);
    display:flex; align-items:flex-end;
  }
  .modal.hidden{display:none;}
  .modal-sheet{
    background:var(--surface);
    width:100%;
    max-height:92vh;
    border-radius:16px 16px 0 0;
    overflow-y:auto;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  }
  .modal-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px;
  }
  .modal-head h2{margin:0; font-size:17px; font-weight:800;}
  .modal-close{
    background:var(--bg); border:none; width:32px; height:32px;
    border-radius:50%; font-size:16px; cursor:pointer; color:var(--muted);
  }

  /* ---------- Form ---------- */
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); margin-bottom:6px;
  }
  .field input, .field select, .field textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--bg);
    color:var(--ink);
  }
  .field textarea{resize:vertical; min-height:64px;}
  .row-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .gps-row{display:flex; gap:8px; align-items:center;}
  .btn{
    padding:11px 16px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--surface);
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    color:var(--ink);
  }
  .btn-primary{background:var(--teal); color:#fff; border-color:var(--teal);}
  .btn-primary:disabled{opacity:.6;}
  .btn-danger{background:#fff; color:var(--red); border-color:var(--red);}
  .btn-block{width:100%;}
  .gps-display{font-size:12px; color:var(--teal); font-family:ui-monospace,"SF Mono","Roboto Mono",Menlo,monospace;}
  #locationMap{height:220px; border-radius:8px; margin-top:10px; border:1px solid var(--border); background:var(--bg);}
  .map-hint{font-size:11px; color:var(--muted); margin-top:6px;}
  .section-label{
    font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--teal); margin:18px 0 10px; padding-top:14px; border-top:1px dashed var(--border);
  }
  .form-actions{display:flex; gap:10px; margin-top:18px;}
  .form-actions .btn{flex:1;}

  .photo-input-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:8px;}
  .photo-thumb{position:relative; width:72px; height:72px;}
  .photo-thumb img{width:100%; height:100%; object-fit:cover; border-radius:8px; border:1px solid var(--border);}
  .photo-thumb button{
    position:absolute; top:-6px; right:-6px;
    width:22px; height:22px; border-radius:50%;
    background:var(--red); color:#fff; border:2px solid var(--surface);
    font-size:11px; line-height:1; cursor:pointer;
  }
  .add-photo-btn{
    width:72px; height:72px;
    border:2px dashed var(--border);
    border-radius:8px;
    background:var(--bg);
    color:var(--muted);
    font-size:22px;
    cursor:pointer;
  }

  /* ---------- Detail ---------- */
  .detail-photos{display:flex; gap:8px; overflow-x:auto; margin-bottom:14px;}
  .detail-photos img{width:96px; height:96px; object-fit:cover; border-radius:8px; flex:none; cursor:pointer;}
  .detail-photo-broken{
    width:96px; height:96px; border-radius:8px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--muted); font-size:22px;
  }
  .detail-status-bar{height:5px; border-radius:4px; margin-bottom:14px;}
  .detail-name{font-size:20px; font-weight:800; margin:0 0 4px;}
  .detail-badge{
    display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase;
    letter-spacing:.04em; padding:4px 10px; border-radius:6px; margin-bottom:14px;
  }
  dl.detail-fields{margin:0;}
  dl.detail-fields dt{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    color:var(--muted); margin-top:12px;
  }
  dl.detail-fields dd{margin:3px 0 0; font-size:14.5px; line-height:1.45;}
  .detail-actions{display:flex; gap:10px; margin-top:20px;}
  .detail-actions .btn{flex:1;}
  .children-list{display:flex; flex-direction:column; gap:8px;}
  .child-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--bg); border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; cursor:pointer;
  }
  .child-name{font-size:14px; font-weight:600;}
  .quick-status-btn{
    display:block; width:100%; text-align:left;
    padding:14px 16px; margin-bottom:8px;
    border:2px solid var(--border); border-radius:8px;
    background:var(--surface); font-weight:700; font-size:15px;
    cursor:pointer;
  }
  .checkbox-group{display:flex; flex-wrap:wrap; gap:8px;}
  .checkbox-row{
    display:flex; align-items:center; gap:6px; font-size:14px;
    background:var(--bg); padding:8px 12px; border-radius:8px; border:1px solid var(--border);
    cursor:pointer;
  }
  .checkbox-row input{width:auto; accent-color:var(--teal);}

  /* ---------- Lightbox ---------- */
  #lightbox{
    position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.92);
    display:flex; align-items:center; justify-content:center;
  }
  #lightbox.hidden{display:none;}
  #lightbox img{max-width:94vw; max-height:78vh; object-fit:contain;}
  .lb-close{position:absolute; top:18px; right:18px; background:rgba(255,255,255,.15); border:none; color:#fff; width:38px; height:38px; border-radius:50%; font-size:18px;}
  .lb-nav{position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.15); border:none; color:#fff; width:44px; height:44px; border-radius:50%; font-size:20px;}
  .lb-prev{left:12px;} .lb-next{right:12px;}

  #importFileInput{display:none;}

  .config-screen{padding:28px 20px; text-align:left;}
  .config-screen h2{font-size:16px; margin:0 0 10px;}
  .config-screen p{font-size:14px; line-height:1.6; color:var(--muted); margin:0;}

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 380px){
    header h1{ font-size:16px; }
    header .sub{ font-size:10px; }
    .icon-btn{ width:32px; height:32px; font-size:14px; }
    .header-actions{ gap:6px; }
    .search-row{ flex-wrap:wrap; }
    .search-row select{ max-width:none; flex:1 1 100%; }
  }
  @media (max-width: 340px){
    .row-2{ grid-template-columns:1fr; }
  }
  @media (min-width: 700px){
    .filters, main{ max-width:640px; margin-left:auto; margin-right:auto; }
    .modal{ align-items:center; }
    .modal-sheet{ max-width:480px; max-height:88vh; border-radius:16px; }
  }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <div>
      <h1>Oqava Suv Inshootlari</h1>
      <div class="sub">Aktivlar bazasi · <span id="connBadge">—</span></div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btnExportCsv" title="Excel (CSV)">📊</button>
      <button class="icon-btn" id="btnExport" title="Zaxira nusxa">⬇</button>
      <button class="icon-btn" id="btnImport" title="Tiklash">⬆</button>
    </div>
  </div>
  <div class="stats-row" id="statsRow"></div>
</header>

<div class="filters">
  <div class="chips" id="categoryChips"></div>
  <div class="search-row">
    <input type="search" id="searchInput" placeholder="Qidirish: nomi, joyi...">
    <select id="statusFilter">
      <option value="all">Holati: barchasi</option>
      <option value="ishlayapti">Ishlayapti</option>
      <option value="tamirda">Ta'mirda</option>
      <option value="nosoz">Nosoz</option>
    </select>
  </div>
  <div class="view-toggle" id="viewToggle">
    <button type="button" class="view-toggle-btn active" data-view="list">📋 Ro'yxat</button>
    <button type="button" class="view-toggle-btn" data-view="map">🗺️ Xarita</button>
  </div>
</div>

<main>
  <div id="assetList">
    <div class="empty-state">Yuklanmoqda...</div>
  </div>
  <div id="overviewMap" class="hidden"></div>
</main>

<button class="fab" id="fabAdd" title="Yangi obyekt">+</button>
<input type="file" id="importFileInput" accept="application/json">

<!-- Form Modal -->
<div class="modal hidden" id="formModal">
  <div class="modal-sheet">
    <div class="modal-head">
      <h2 id="formTitle">Yangi obyekt qo'shish</h2>
      <button class="modal-close" id="btnCloseForm">✕</button>
    </div>
    <form id="assetForm">
      <div class="field">
        <label>Kategoriya</label>
        <select id="fCategory"></select>
      </div>
      <div class="field">
        <label>Turi</label>
        <select id="fSubtype"></select>
      </div>
      <div class="field">
        <label>Qaysi inshoot tarkibida? (ixtiyoriy)</label>
        <select id="fParent"></select>
        <div class="map-hint">Bu jihoz/qism biror inshoot ichida bo'lsa, o'shani tanlang. Mustaqil obyekt bo'lsa — bo'sh qoldiring.</div>
      </div>
      <div class="field">
        <label>Nomi / raqami</label>
        <input type="text" id="fName" placeholder="Masalan: KNS-4, Aerotenk-2" required>
      </div>
      <div class="field">
        <label>Joylashuvi</label>
        <input type="text" id="fLocation" placeholder="Manzil yoki mo'ljal">
        <div class="gps-row" style="margin-top:8px;">
          <button type="button" class="btn" id="btnGPS">📍 GPS olish</button>
          <span class="gps-display" id="gpsDisplay"></span>
        </div>
        <div id="locationMap"></div>
        <div class="map-hint">Xaritada bosing yoki markerni suring — aniq nuqtani belgilash uchun</div>
      </div>
      <div id="fExtraFields"></div>
      <div class="row-2">
        <div class="field">
          <label>O'rnatilgan sana</label>
          <input type="date" id="fInstallDate">
        </div>
        <div class="field">
          <label>Holati</label>
          <select id="fStatus">
            <option value="ishlayapti">Ishlayapti</option>
            <option value="tamirda">Ta'mirda</option>
            <option value="nosoz">Nosoz</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Oxirgi ta'mirlash sanasi</label>
        <input type="date" id="fLastRepair">
      </div>
      <div class="field">
        <label>Texnik xususiyatlari</label>
        <textarea id="fSpecs" placeholder="Quvvati, o'lchami, rusumi va h.k."></textarea>
      </div>
      <div class="field">
        <label>Izoh</label>
        <textarea id="fNotes"></textarea>
      </div>
      <div class="field">
        <label>Rasmlar</label>
        <div class="photo-input-row" id="fPhotoPreviews"></div>
        <button type="button" class="add-photo-btn" id="btnAddPhoto" style="margin-top:8px;">📷</button>
        <input type="file" id="fPhotoInput" accept="image/*" multiple style="display:none;">
      </div>
      <div class="form-actions">
        <button type="button" class="btn" id="btnCancelForm">Bekor qilish</button>
        <button type="submit" class="btn btn-primary" id="btnSaveForm">Saqlash</button>
      </div>
    </form>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal hidden" id="detailModal">
  <div class="modal-sheet">
    <div class="modal-head">
      <h2>Obyekt ma'lumoti</h2>
      <button class="modal-close" id="btnCloseDetail">✕</button>
    </div>
    <div id="detailContent"></div>
    <div class="detail-actions">
      <button class="btn btn-danger" id="btnDeleteDetail">O'chirish</button>
      <button class="btn btn-primary" id="btnEditDetail">Tahrirlash</button>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div class="modal hidden" id="lightbox">
  <button class="lb-close" id="lbClose">✕</button>
  <button class="lb-nav lb-prev" id="lbPrev">‹</button>
  <img id="lightboxImg" src="" alt="">
  <button class="lb-nav lb-next" id="lbNext">›</button>
</div>

<!-- Quick status change -->
<div class="modal hidden" id="quickStatusModal">
  <div class="modal-sheet">
    <div class="modal-head">
      <h2>Holatni tezda o'zgartirish</h2>
      <button class="modal-close" id="btnCloseQuickStatus">✕</button>
    </div>
    <div id="quickStatusButtons"></div>
  </div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    db = null;
  }
}

  /* ================= Photo handling ================= */
  function compressImage(file, maxWidth, quality){
    maxWidth = maxWidth || 900;
    quality = quality || 0.5;
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          if (w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = function(){ reject(new Error('image load failed')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('file read failed')); };
      reader.readAsDataURL(file);
    });
  }

    btn.textContent = 'Aniqlanmoqda...';
    navigator.geolocation.getCurrentPosition(
      function(pos){
        setFormLatLng(pos.coords.latitude, pos.coords.longitude, true);
        btn.textContent = 'GPS ni qayta olish';
      },
      function(){
        showToast("GPS: joylashuvni aniqlab bo'lmadi");
        btn.textContent = original;
      },
      { enableHighAccuracy:true, timeout:10000 }
    );
  }

  /* ================= Form open/close/submit ================= */
  function openAddForm(){
    editingId = null;
    formPhotos = [];
    formLat = null; formLng = null;
    document.getElementById('formTitle').textContent = "Yangi obyekt qo'shish";
    document.getElementById('assetForm').reset();
    populateSubtypes(CATEGORIES[0].id);
    renderExtraFieldsInputs(CATEGORIES[0].id);
    populateParentOptions(null, null);
    document.getElementById('fStatus').value = 'ishlayapti';
    document.getElementById('gpsDisplay').textContent = '';
    document.getElementById('btnGPS').textContent = '📍 GPS olish';
    renderFormPhotos();
    document.getElementById('formModal').classList.remove('hidden');
    showPickerAt(null, null);
  }

  function openEditForm(id){
    var a = assets.filter(function(x){ return x.id === id; })[0];
    if (!a) return;
    editingId = id;
    formPhotos = (a.photos || []).slice();
    formLat = (typeof a.lat === 'number') ? a.lat : null;
    formLng = (typeof a.lng === 'number') ? a.lng : null;
    document.getElementById('formTitle').textContent = 'Obyektni tahrirlash';
    document.getElementById('fCategory').value = a.category;
    populateSubtypes(a.category, a.subtype);
    renderExtraFieldsInputs(a.category, a.extra);
    populateParentOptions(a.id, a.parentId);
    document.getElementById('fName').value = a.name || '';
    document.getElementById('fLocation').value = a.location || '';
    document.getElementById('fInstallDate').value = a.installDate || '';
    document.getElementById('fStatus').value = a.status || 'ishlayapti';
    document.getElementById('fLastRepair').value = a.lastRepairDate || '';
    document.getElementById('fSpecs').value = a.specs || '';
    document.getElementById('fNotes').value = a.notes || '';
    document.getElementById('gpsDisplay').textContent = (formLat && formLng) ? ('📍 ' + formLat.toFixed(6) + ', ' + formLng.toFixed(6)) : '';
    document.getElementById('btnGPS').textContent = '📍 GPS olish';
    renderFormPhotos();
    closeDetail();
    document.getElementById('formModal').classList.remove('hidden');
    showPickerAt(formLat, formLng);
  }

  function closeForm(){ document.getElementById('formModal').classList.add('hidden'); }

  function handleFormSubmit(e){
    e.preventDefault();
    var name = document.getElementById('fName').value.trim();
    if (!name){ showToast('Nomini kiriting'); return; }
    var existing = editingId ? assets.filter(function(x){ return x.id === editingId; })[0] : null;
    var asset = {
      id: editingId || uid(),
      category: document.getElementById('fCategory').value,
      subtype: document.getElementById('fSubtype').value,
      parentId: document.getElementById('fParent').value || null,
      name: name,
      location: document.getElementById('fLocation').value.trim(),
      lat: formLat, lng: formLng,
      installDate: document.getElementById('fInstallDate').value,
      status: document.getElementById('fStatus').value,
      lastRepairDate: document.getElementById('fLastRepair').value,
      specs: document.getElementById('fSpecs').value.trim(),
      notes: document.getElementById('fNotes').value.trim(),
      extra: collectExtraFields(),
      photos: formPhotos.slice(),
      createdAt: existing ? (existing.createdAt || Date.now()) : Date.now(),
      updatedAt: Date.now()
    };

    var approxSize = JSON.stringify(asset).length;
    if (approxSize > 900000){
      showToast("Rasmlar juda katta (limit ~900KB). Birortasini o'chiring.");
      return;
    }

    var saveBtn = document.getElementById('btnSaveForm');
    saveBtn.disabled = true; saveBtn.textContent = 'Saqlanmoqda...';
    saveAssetToDb(asset).then(function(ok){
      saveBtn.disabled = false; saveBtn.textContent = 'Saqlash';
      if (!ok){ showToast('Saqlashda xatolik yuz berdi'); return; }
      closeForm();
      showToast(editingId ? 'Yangilandi' : "Qo'shildi");
    });
  }

  /* ================= Detail ================= */
  function formatServiceAge(installDateStr){
    try{
      var d = new Date(installDateStr);
      if (isNaN(d.getTime())) return '';
      var years = (Date.now() - d.getTime()) / (365.25 * 24 * 3600 * 1000);
      if (years < 0) return '';
      return ' <span class="mono" style="color:var(--muted);">(' + years.toFixed(1) + ' yildan beri)</span>';
    } catch(e){ return ''; }
  }

  function openDetail(id){
    var a = assets.filter(function(x){ return x.id === id; })[0];
    if (!a) return;
    currentDetailId = id;
    var cat = getCategory(a.category) || {};
    var status = getStatus(a.status) || {};
    var html = '';
    html += '<div class="detail-status-bar" style="background:' + (status.color||'#ccc') + '"></div>';
    if (a.photos && a.photos.length){
      html += '<div class="detail-photos">' + a.photos.map(function(p,i){ return '<img data-idx="' + i + '" src="' + p + '">'; }).join('') + '</div>';
    }
    html += '<div class="detail-name">' + escapeHtml(a.name) + '</div>';
    html += '<div class="detail-badge" style="background:' + (status.color||'#ccc') + '22;color:' + (status.color||'#666') + '">' + escapeHtml(status.name||'') + '</div>';
    html += '<dl class="detail-fields">';
    html += '<dt>Kategoriya</dt><dd>' + (cat.icon||'') + ' ' + escapeHtml(cat.name||'') + (a.subtype ? ' • ' + escapeHtml(a.subtype) : '') + '</dd>';
    if (a.parentId){
      var parent = assets.filter(function(x){ return x.id === a.parentId; })[0];
      if (parent){
        html += '<dt>Tegishli inshoot</dt><dd><a href="#" data-jump-parent="' + parent.id + '">' + escapeHtml(parent.name||'') + ' →</a></dd>';
      }
    }
    if (a.location){
      html += '<dt>Joylashuvi</dt><dd>📍 ' + escapeHtml(a.location);
      if (typeof a.lat === 'number' && typeof a.lng === 'number'){
        html += ' — <a href="https://maps.google.com/?q=' + a.lat + ',' + a.lng + '" target="_blank" rel="noopener">xaritada ko\'rish</a>';
      }
      html += '</dd>';
    }
    if (a.installDate){
      html += "<dt>O'rnatilgan sana</dt><dd>" + escapeHtml(a.installDate) + formatServiceAge(a.installDate) + '</dd>';
    }
    if (a.lastRepairDate) html += "<dt>Oxirgi ta'mirlash</dt><dd>" + escapeHtml(a.lastRepairDate) + '</dd>';
    if (a.extra && cat.extraFields){
      cat.extraFields.forEach(function(f){
        var v = a.extra[f.key];
        if (v){ html += '<dt>' + escapeHtml(f.label) + '</dt><dd>' + escapeHtml(v) + '</dd>'; }
      });
    }
    if (a.specs) html += '<dt>Texnik xususiyatlari</dt><dd>' + escapeHtml(a.specs) + '</dd>';
    if (a.notes) html += '<dt>Izoh</dt><dd>' + escapeHtml(a.notes) + '</dd>';
    html += '</dl>';
    var children = getChildren(a.id);
    if (children.length){
      html += '<div class="section-label">Tarkibiy qismlar (' + children.length + ')</div>';
      html += '<div class="children-list">' + children.map(function(c){
        var cs = getStatus(c.status) || {};
        var ccat = getCategory(c.category) || {};
        return '<div class="child-row" data-child-id="' + c.id + '">' +
          '<span class="child-name">' + (ccat.icon||'') + ' ' + escapeHtml(c.name||'Nomsiz') + '</span>' +
          '<span class="card-status" style="background:' + (cs.color||'#ccc') + '22;color:' + (cs.color||'#666') + '">' + escapeHtml(cs.name||'') + '</span>' +
        '</div>';
      }).join('') + '</div>';
    }
    document.getElementById('detailContent').innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll('.child-row'), function(row){
      row.addEventListener('click', function(){ openDetail(row.getAttribute('data-child-id')); });
    });
    var parentLink = document.querySelector('[data-jump-parent]');
    if (parentLink){
      parentLink.addEventListener('click', function(e){ e.preventDefault(); openDetail(parentLink.getAttribute('data-jump-parent')); });
    }
    Array.prototype.forEach.call(document.querySelectorAll('.detail-photos img'), function(img){
      attachImgFallback(img, 'detail-photo-broken', '🖼️');
      img.addEventListener('click', function(){ openLightbox(a.photos, parseInt(img.getAttribute('data-idx'),10)); });
    });
    document.getElementById('detailModal').classList.remove('hidden');
  }
  function closeDetail(){ document.getElementById('detailModal').classList.add('hidden'); }

  function confirmDeleteCurrent(){
    if (!currentDetailId) return;
    if (!confirm("Bu obyektni o'chirishni tasdiqlaysizmi? Bu amalni bekor qilib bo'lmaydi.")) return;
    var id = currentDetailId;
    deleteAssetFromDb(id).then(function(ok){
      closeDetail();
      showToast(ok ? "O'chirildi" : "O'chirishda xatolik");
    });
  }

  /* ================= Lightbox ================= */
  function openLightbox(photos, idx){
    if (!photos || !photos.length){ showToast('Rasm topilmadi'); return; }
    lightboxPhotos = photos;
    lightboxIndex = Math.max(0, Math.min(idx || 0, photos.length - 1));
    renderLightbox();
    document.getElementById('lightbox').classList.remove('hidden');
  }
  function renderLightbox(){
    var img = document.getElementById('lightboxImg');
    var src = lightboxPhotos[lightboxIndex];
    if (!src){ document.getElementById('lightbox').classList.add('hidden'); return; }
    img.src = src;
  }
  function lightboxNav(dir){
    if (!lightboxPhotos.length) return;
    lightboxIndex = (lightboxIndex + dir + lightboxPhotos.length) % lightboxPhotos.length;
    renderLightbox();
  }

  /* ================= Export / Import ================= */
  function csvEscape(val){
    var s = (val === undefined || val === null) ? '' : String(val);
    if (/[",\n]/.test(s)){ s = '"' + s.replace(/"/g, '""') + '"'; }
    return s;
  }

  function exportCSV(){
    var headers = ['Nomi','Kategoriya','Turi','Tegishli inshoot','Holati','Joylashuvi','Latitude','Longitude',"O'rnatilgan sana","Oxirgi ta'mirlash sanasi","Qo'shimcha xususiyatlar",'Texnik xususiyatlari','Izoh','Rasmlar soni'];
    var rows = [headers.map(csvEscape).join(',')];
    assets.forEach(function(a){
      var cat = getCategory(a.category) || {};
      var status = getStatus(a.status) || {};
      var parentName = '';
      if (a.parentId){
        var parent = assets.filter(function(x){ return x.id === a.parentId; })[0];
        parentName = parent ? (parent.name || '') : '';
      }
      var extraText = '';
      if (a.extra && cat.extraFields){
        extraText = cat.extraFields
          .filter(function(f){ return a.extra[f.key]; })
          .map(function(f){ return f.label + ': ' + a.extra[f.key]; })
          .join('; ');
      }
      var row = [
        a.name || '', cat.name || '', a.subtype || '', parentName, status.name || '', a.location || '',
        (typeof a.lat === 'number') ? a.lat : '', (typeof a.lng === 'number') ? a.lng : '',
        a.installDate || '', a.lastRepairDate || '', extraText, a.specs || '', a.notes || '',
        (a.photos ? a.photos.length : 0)
      ];
      rows.push(row.map(csvEscape).join(','));
    });
    var csvContent = '\uFEFF' + rows.join('\r\n');
    var blob = new Blob([csvContent], { type:'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var link = document.createElement('a');
    link.href = url;
    link.download = 'oqava-inshootlari-' + new Date().toISOString().slice(0,10) + '.csv';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast('Excel (CSV) fayli yuklab olindi');
  }

  function exportData(){
    var data = { exportedAt: new Date().toISOString(), assets: assets };
    var blob = new Blob([JSON.stringify(data)], { type:'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'oqava-inshootlari-zaxira-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast('Zaxira fayli yuklab olindi');
  }

  function importDataFile(file){
    var reader = new FileReader();
    reader.onload = function(e){
      var data;
      try { data = JSON.parse(e.target.result); }
      catch(err){ showToast('Fayl formatida xatolik'); return; }
      var list = Array.isArray(data.assets) ? data.assets : (Array.isArray(data) ? data : null);
      if (!list){ showToast('Fayl formatida xatolik'); return; }
      showToast('Import qilinmoqda...');
      var chain = Promise.resolve();
      var count = 0;
      list.forEach(function(a){
        chain = chain.then(function(){
          var newAsset = {
            id: a.id || uid(),
            category: a.category || CATEGORIES[0].id,
            subtype: a.subtype || '',
            parentId: a.parentId || null,
            name: a.name || 'Nomsiz',
            location: a.location || '',
            lat: (typeof a.lat === 'number') ? a.lat : null,
            lng: (typeof a.lng === 'number') ? a.lng : null,
            installDate: a.installDate || '',
            status: a.status || 'ishlayapti',
            lastRepairDate: a.lastRepairDate || '',
            specs: a.specs || '',
            notes: a.notes || '',
            extra: (a.extra && typeof a.extra === 'object') ? a.extra : {},
            photos: Array.isArray(a.photos) ? a.photos : [],
            createdAt: a.createdAt || Date.now(),
            updatedAt: Date.now()
          };
          return saveAssetToDb(newAsset).then(function(){ count++; });
        });
      });
      chain.then(function(){ showToast(count + " ta obyekt qo'shildi"); });
    };
    reader.readAsText(file);
  }

  /* ================= Wire up events ================= */
  function attachEvents(){
    document.getElementById('fabAdd').addEventListener('click', openAddForm);
    document.getElementById('btnCloseForm').addEventListener('click', closeForm);
    document.getElementById('btnCancelForm').addEventListener('click', closeForm);
    document.getElementById('formModal').addEventListener('click', function(e){ if (e.target.id === 'formModal') closeForm(); });
    document.getElementById('assetForm').addEventListener('submit', handleFormSubmit);
    document.getElementById('fCategory').addEventListener('change', function(){ populateSubtypes(this.value); renderExtraFieldsInputs(this.value); });
    document.getElementById('btnGPS').addEventListener('click', captureGPS);
    document.getElementById('btnAddPhoto').addEventListener('click', function(){ document.getElementById('fPhotoInput').click(); });
    document.getElementById('fPhotoInput').addEventListener('change', function(e){ handlePhotoFiles(e.target.files); e.target.value=''; });

    document.getElementById('btnCloseDetail').addEventListener('click', closeDetail);
    document.getElementById('detailModal').addEventListener('click', function(e){ if (e.target.id === 'detailModal') closeDetail(); });
    document.getElementById('btnDeleteDetail').addEventListener('click', confirmDeleteCurrent);
    document.getElementById('btnEditDetail').addEventListener('click', function(){ openEditForm(currentDetailId); });

    document.getElementById('lbClose').addEventListener('click', function(){ document.getElementById('lightbox').classList.add('hidden'); });
    document.getElementById('lightboxImg').addEventListener('error', function(){
      document.getElementById('lightbox').classList.add('hidden');
      showToast("Rasmni ochib bo'lmadi");
    });
    document.getElementById('lightbox').addEventListener('click', function(e){ if (e.target.id === 'lightbox') document.getElementById('lightbox').classList.add('hidden'); });
    document.getElementById('lbPrev').addEventListener('click', function(){ lightboxNav(-1); });
    document.getElementById('lbNext').addEventListener('click', function(){ lightboxNav(1); });

    var searchTimer;
    document.getElementById('searchInput').addEventListener('input', function(e){
      clearTimeout(searchTimer);
      var val = e.target.value;
      searchTimer = setTimeout(function(){ currentFilter.search = val; renderCurrentView(); }, 200);
    });
    document.getElementById('statusFilter').addEventListener('change', function(e){
      currentFilter.status = e.target.value;
      renderCurrentView();
    });
    Array.prototype.forEach.call(document.querySelectorAll('.view-toggle-btn'), function(btn){
      btn.addEventListener('click', function(){ setView(btn.getAttribute('data-view')); });
    });
    document.getElementById('btnCloseQuickStatus').addEventListener('click', closeQuickStatus);
    document.getElementById('quickStatusModal').addEventListener('click', function(e){ if (e.target.id === 'quickStatusModal') closeQuickStatus(); });

    document.getElementById('btnExportCsv').addEventListener('click', exportCSV);
    document.getElementById('btnExport').addEventListener('click', exportData);
    document.getElementById('btnImport').addEventListener('click', function(){ document.getElementById('importFileInput').click(); });
    document.getElementById('importFileInput').addEventListener('change', function(e){
      if (e.target.files && e.target.files[0]) importDataFile(e.target.files[0]);
      e.target.value = '';
    });
  }

  /* ================= Config-needed screen ================= */
  function showConfigNeededScreen(){
    document.getElementById('assetList').innerHTML =
      '<div class="config-screen">' +
        '<h2>⚙️ Firebase hali sozlanmagan</h2>' +
        '<p>Fayl boshidagi <code>firebaseConfig</code> qismiga Firebase loyihangizning kalitlarini joylashtiring, so\'ng faylni saqlang. Qadamlar chatda yozilgan.</p>' +
      '</div>';
    document.getElementById('fabAdd').style.display = 'none';
    document.getElementById('btnExportCsv').style.display = 'none';
    document.getElementById('btnExport').style.display = 'none';
    document.getElementById('btnImport').style.display = 'none';
    document.getElementById('viewToggle').style.display = 'none';
    document.getElementById('connBadge').textContent = '⚙️ sozlanmagan';
  }

  /* ================= Init ================= */
  function init(){
    renderCategoryChips();
    populateFormCategories();
    attachEvents();
    if (!isConfigured){
      showConfigNeededScreen();
      return;
    }
    startListening();
  }

  init();
})();
</script>
